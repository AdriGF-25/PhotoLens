<!-- ------------------- CABECERA/NAV ---------------- -->

<header class="cabecera">
    <div class="cabecera__contenedor">
        <a href="#" class="cabecera__logo">
            <span class="cabecera__logo-texto">anime<span class="cabecera__logo-acento">'n'</span>chill</span>
        </a>

        <button class="cabecera__boton-menu" id="botonMenu" aria-label="Abrir menú de navegación">
            ☰
        </button>

        <nav class="cabecera__nav" id="navegacionPrincipal" aria-label="Navegación principal">
            <ul class="cabecera__lista">
                <li class="cabecera__item"><a href="#" class="cabecera__enlace cabecera__enlace--activo">Novedades</a></li>
                <li class="cabecera__item"><a href="#" class="cabecera__enlace">Manga</a></li>
                <li class="cabecera__item"><a href="#" class="cabecera__enlace">Anime</a></li>
                <li class="cabecera__item"><a href="#" class="cabecera__enlace">Mi lista</a></li>
            </ul>
        </nav>

        <div class="cabecera__acciones">
            <div class="selector-tema">
                <button class="selector-tema__boton" id="botonTema" aria-label="Abrir selector de tema">
                    Tema
                </button>

                <div class="selector-tema__menu" id="menuTema">
                    <button class="selector-tema__opcion" data-tema="claro">Claro</button>
                    <button class="selector-tema__opcion" data-tema="oscuro">Oscuro</button>
                    <button class="selector-tema__opcion" data-tema="tarde">Tarde</button>
                    <button class="selector-tema__opcion" data-tema="noche">Noche</button>
                </div>
            </div>

            <a href="#" class="cabecera__boton-perfil">Perfil</a>
        </div>
    </div>
</header>
