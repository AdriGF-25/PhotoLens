<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticia | anime'n'chill</title>

    <link rel="stylesheet" href="detalle-noticia.css">
</head>
<body>

    <!-- ------------------- CABEZERA/NAV ---------------- -->
    <div id="contenedor-header"></div>

   

    <!-- ------------------- CONTENIDO PRINCIPAL ---------------- -->
    <main class="detalle-principal" id="detallePrincipal">

        <div class="detalle-layout">

            <!-- ------------------- COLUMNA ARTÍCULO ---------------- -->
            <article class="detalle-articulo" id="detalleArticulo">

                <!-- Cabecera del artículo: etiqueta + título + meta -->
                <header class="detalle-articulo__cabecera">
                    <!--
                        STUB: contador de comentarios — oculto hasta implementar el feature.
                        Cuando se implemente, quitar la clase 'oculto' y rellenar el número.
                    -->
                    <div class="detalle-articulo__meta-superior">
                    <span class="etiqueta etiqueta--anime" id="detalleEtiqueta">Cargando...</span>
                    <button id="toggleIdioma" class="boton-primario" style="margin-left: 0.5rem;">Español</button>
                        <span class="detalle-comentarios oculto" id="detalleComentarios" aria-label="Número de comentarios">
                            <span class="detalle-comentarios__icono">💬</span>
                            <span class="detalle-comentarios__numero" id="detalleComentariosNumero">0</span>
                            <span>comentarios</span>
                        </span>
                    </div>

                    <h1 class="detalle-articulo__titulo" id="detalleTitulo">
                        Cargando noticia...
                    </h1>

                    <!-- Fecha de publicación y fuente -->
                    <div class="detalle-articulo__meta">
                        <span class="detalle-articulo__fecha" id="detalleFecha"></span>
                        <span class="detalle-articulo__separador">·</span>
                        <span class="detalle-articulo__fuente">
                            Fuente:
                            <a
                                href="#"
                                id="detalleFuenteEnlace"
                                class="detalle-articulo__enlace-fuente"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Anime News Network
                            </a>
                        </span>
                    </div>
                </header>

                <!-- Imagen destacada del artículo -->
                <div class="detalle-articulo__imagen-contenedor">
                    <img
                        class="detalle-articulo__imagen"
                        id="detalleImagen"
                        src=""
                        alt=""
                        loading="eager"
                    >
                </div>

                <!-- Cuerpo del artículo -->
                <!--
                    El contenido se inserta dinámicamente desde el JS.
                    Los enlaces externos dentro del cuerpo reciben la clase
                    'enlace-externo' automáticamente para mostrarse con color de acento.
                -->
                <div class="detalle-articulo__cuerpo" id="detalleCuerpo">
                    <!-- El JS insertará aquí la descripción de la noticia -->
                </div>

                <!-- Enlace a la fuente original — obligatorio por ToS de ANN -->
                <!-- Footer con enlace a ANN eliminado, ya no es necesario -->
            </article>

            <!-- ------------------- SIDEBAR ---------------- -->
            <aside class="detalle-sidebar" id="detalleSidebar">

                <!-- ------------------- NOTICIAS RELACIONADAS ---------------- -->
                <section class="sidebar-seccion" aria-label="Noticias relacionadas">
                    <h2 class="sidebar-seccion__titulo">Relacionadas</h2>
                    <!--
                        El JS cargará entre 3 y 5 noticias del mismo tipo (anime/manga).
                        Si no hay suficientes del mismo tipo, rellena con cualquier tipo.
                    -->
                    <div class="sidebar-relacionadas" id="sidebarRelacionadas">
                        <!-- El JS insertará aquí las tarjetas de noticias relacionadas -->
                    </div>
                </section>

                <!-- ------------------- RECOMENDACIÓN MANGAS ---------------- -->
                <!--
                    PREPARADO PARA SESIÓN:
                    - Sin sesión → muestra portada del tomo 1 del manga al hacer hover
                    - Con sesión → muestra portada del tomo en el que va el usuario
                -->
                <section class="sidebar-seccion" aria-label="Mangas recomendados">
                    <h2 class="sidebar-seccion__titulo">Mangas destacados</h2>
                    <ul class="sidebar-recomendaciones" id="sidebarMangas"></ul>
                </section>

                <!-- ------------------- RECOMENDACIÓN ANIMES ---------------- -->
                <!--
                    PREPARADO PARA IMPLEMENTACIÓN FUTURA:
                    - Por ahora solo muestra la portada del anime al hacer hover.
                -->
                <section class="sidebar-seccion" aria-label="Animes recomendados">
                    <h2 class="sidebar-seccion__titulo">Animes destacados</h2>
                    <ul class="sidebar-recomendaciones" id="sidebarAnimes"></ul>
                </section>

            </aside>

        </div>
    </main>

    <!-- ------------------- FOOTER ---------------- -->
    <div id="contenedor-footer"></div>

    <script src="../../componentes/componentes.js"></script>
    <script src="./detalle-noticia.js"></script>
</body>
</html>
