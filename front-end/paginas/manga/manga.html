<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga | anime'n'chill</title>
    <link rel="stylesheet" href="manga.css">
</head>
<body>


    <!-- ------------------- CABECERA/NAV ---------------- -->
    <div id="contenedor-header"></div>


    <main class="contenido-principal">


        <!-- ------------------- FILTROS ------------------- -->
        <section class="zona-filtros" aria-label="Filtros de manga">
            <div class="zona-filtros__interior">
                <div class="filtros" id="contenedorFiltros" role="group" aria-label="Filtrar por categoría">
                    <!-- Los filtros se generan dinámicamente desde manga.js -->
                </div>
                <div class="manga-busqueda">
                    <input
                        type="search"
                        class="manga-busqueda__input"
                        id="inputBusqueda"
                        placeholder="Buscar manga..."
                        aria-label="Buscar manga por título"
                    >
                </div>
            </div>
        </section>


        <!-- ------------------- SECCIONES POR CATEGORÍA ------------------- -->
        <div class="manga-secciones" id="contenedorSecciones">
            <!-- Las secciones y tarjetas se generan dinámicamente desde manga.js -->
        </div>


    </main>


    <!-- ------------------- MODAL DETALLE MANGA ------------------- -->
    <div class="manga-modal" id="mangaModal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="manga-modal__fondo" id="modalFondo"></div>
        <div class="manga-modal__contenedor">


            <!-- ------------------- PANEL IZQUIERDO (1/3) ------------------- -->
            <aside class="manga-modal__panel-izq">
                <div class="manga-modal__portada-contenedor">
                    <img
                        class="manga-modal__portada"
                        id="modalPortada"
                        src="../../assets/placeholders/placeholder-portada.jpg"
                        alt="Portada del manga seleccionado"
                        width="260"
                        height="380"
                    >
                </div>
                <div class="manga-modal__info-lateral">
                    <h2 class="manga-modal__titulo" id="modalTitulo">Título del Manga</h2>
                    <span class="manga-modal__genero" id="modalGenero">Género</span>
                </div>
                <button class="manga-modal__boton-continuar" id="modalBotonContinuar" aria-label="Continuar lectura">
                    Continuar<br>
                    <small id="modalUltimoCapitulo">Sin progreso</small>
                </button>
            </aside>


            <!-- ------------------- PANEL DERECHO (2/3) — CAPÍTULOS ------------------- -->
            <div class="manga-modal__panel-der">
                <div class="manga-modal__cabecera-der">
                    <h3 class="manga-modal__subtitulo">Capítulos</h3>
                    <button class="manga-modal__cerrar" id="modalCerrar" aria-label="Cerrar modal">✕</button>
                </div>
                <div class="manga-modal__capitulos-lista" id="modalCapitulosLista">
                    <!-- Los capítulos se cargan dinámicamente al abrir el modal -->
                </div>
            </div>


        </div>
    </div>
    <!-- ------------------- FIN MODAL ------------------- -->


    <!-- ------------------- FOOTER ---------------- -->
    <div id="contenedor-footer"></div>


    <script src="../../componentes/componentes.js"></script>
    <script src="./manga.js"></script>
</body>
</html>
