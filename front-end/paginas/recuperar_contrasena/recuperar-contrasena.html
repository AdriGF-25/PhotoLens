<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anime'n'chill</title>

    <!-- ------------------- FUENTE ------------------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ------------------- ESTILOS ------------------- -->
    <link rel="stylesheet" href="../../componentes/temas.css">
    <link rel="stylesheet" href="./recuperar-contrasena.css">
</head>
<body>

    <!-- ------------------- FONDO ------------------- -->
    <div class="rc-fondo" aria-hidden="true">
        <img
            class="rc-fondo__imagen"
            src="https://picsum.photos/seed/animenchill-login/1920/1080"
            alt=""
        >
        <div class="rc-fondo__overlay"></div>
    </div>

    <!-- ------------------- PÁGINA ------------------- -->
    <main class="rc-pagina">

        <!-- Logo -->
        <a href="/front-end/paginas/novedades/novedades.html" class="rc-logo" aria-label="Ir a la página principal">
            anime<span class="rc-logo__acento">'n'</span>chill
        </a>

        <!-- ------------------- CAJA ------------------- -->
        <div class="rc-caja">

            <!-- ------------------- CABECERA ------------------- -->
            <header class="rc-caja__cabecera">
                <h1 class="rc-caja__titulo">Cambiar contraseña</h1>
                <p class="rc-caja__subtitulo" id="rcSubtitulo">
                    Introduce tu contraseña actual y elige una nueva.
                </p>
            </header>

            <!-- ------------------- FORMULARIO ------------------- -->
            <form class="rc-formulario" id="formularioRecuperar" novalidate>

                <!-- Email — solo visible en modo NO logueado -->
                <div class="campo" id="campoEmail">
                    <label class="campo__etiqueta" for="rcEmail">Correo electrónico</label>
                    <input
                        class="campo__input"
                        type="email"
                        id="rcEmail"
                        name="email"
                        autocomplete="email"
                        placeholder="tu@email.com"
                    >
                    <span class="campo__error" id="errorEmail"></span>
                </div>

                <!-- Contraseña actual -->
                <div class="campo">
                    <label class="campo__etiqueta" for="rcPasswordActual">Contraseña actual</label>
                    <div class="campo__input-contenedor">
                        <input
                            class="campo__input"
                            type="password"
                            id="rcPasswordActual"
                            name="password_actual"
                            autocomplete="current-password"
                            placeholder="Tu contraseña actual"
                            required
                        >
                        <button type="button" class="campo__boton-ojo" id="ojoPasActual" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-icono ojo-icono--cerrado" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                            <svg class="ojo-icono ojo-icono--abierto oculto" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="campo__error" id="errorPasswordActual"></span>
                </div>

                <!-- Nueva contraseña -->
                <div class="campo">
                    <label class="campo__etiqueta" for="rcNuevaPassword">Nueva contraseña</label>
                    <div class="campo__input-contenedor">
                        <input
                            class="campo__input"
                            type="password"
                            id="rcNuevaPassword"
                            name="nueva_password"
                            autocomplete="new-password"
                            placeholder="Mínimo 6 caracteres"
                            required
                        >
                        <button type="button" class="campo__boton-ojo" id="ojoNueva" aria-label="Mostrar nueva contraseña" aria-pressed="false">
                            <svg class="ojo-icono ojo-icono--cerrado" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                            <svg class="ojo-icono ojo-icono--abierto oculto" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="campo__error" id="errorNuevaPassword"></span>
                </div>

                <!-- Confirmar nueva contraseña -->
                <div class="campo">
                    <label class="campo__etiqueta" for="rcConfirmarPassword">Confirmar nueva contraseña</label>
                    <div class="campo__input-contenedor">
                        <input
                            class="campo__input"
                            type="password"
                            id="rcConfirmarPassword"
                            name="nueva_password2"
                            autocomplete="new-password"
                            placeholder="Repite la nueva contraseña"
                            required
                        >
                        <button type="button" class="campo__boton-ojo" id="ojoConfirmar" aria-label="Mostrar confirmación" aria-pressed="false">
                            <svg class="ojo-icono ojo-icono--cerrado" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                            <svg class="ojo-icono ojo-icono--abierto oculto" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="campo__error" id="errorConfirmarPassword"></span>
                </div>

                <!-- ------------------- FEEDBACK GLOBAL ------------------- -->
                <div class="rc-feedback oculto" id="rcFeedback" role="alert">
                    <span id="rcFeedbackTexto"></span>
                </div>

                <!-- Submit -->
                <button type="submit" class="boton-rc" id="botonCambiar">
                    Cambiar contraseña
                </button>

            </form>

            <!-- ------------------- PIE ------------------- -->
            <footer class="rc-caja__pie">
                <a href="#" class="rc-caja__volver" id="enlaceVolver">
                    ← Volver
                </a>
            </footer>

        </div>

    </main>

    <script src="./recuperar-contrasena.js"></script>
</body>
</html>
