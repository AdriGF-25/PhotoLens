<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | anime'n'chill</title>

    <!-- ------------------- FUENTE ------------------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ------------------- ESTILOS ------------------- -->
    <link rel="stylesheet" href="../../componentes/temas.css">
    <link rel="stylesheet" href="./login.css">
    <!-- ------------------- FAVICON ------------------- -->
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/favicon.ico">
</head>
<body>

    <!-- ------------------- FONDO ------------------- -->
    <div class="login-fondo" aria-hidden="true">
        <img
            class="login-fondo__imagen"
            src="../../assets/fondo_login.jpeg"
            alt=""
        >
        <div class="login-fondo__overlay"></div>
        <div class="login-fondo__detalle"></div>
    </div>

    <!-- ------------------- PÁGINA ------------------- -->
    <main class="login-pagina">

        <!-- ------------------- LOGO ------------------- -->
        <a href="/front-end/paginas/novedades/novedades.html" class="login-logo" aria-label="Ir a la página principal">
            <img src="../../assets/logo_animenchill.png" alt="anime'n'chill" class="login-logo__imagen">
        </a>
        <!-- ------------------- BANNER ÉXITO ------------------- -->
        <div class="login-banner-exito oculto" id="bannerExito" role="status">
            <span>✓ ¡Cuenta creada! Ya puedes iniciar sesión.</span>
        </div>

        <!-- ------------------- CAJA ------------------- -->
        <section class="login-caja" aria-labelledby="tituloLogin">

            <!-- ------------------- CABECERA ------------------- -->
            <header class="login-caja__cabecera">
                <span class="login-caja__etiqueta">Acceso</span>
                <h1 class="login-caja__titulo" id="tituloLogin">Bienvenido de nuevo</h1>
            </header>

            <!-- ------------------- FORMULARIO ------------------- -->
            <form class="login-formulario" id="formularioLogin" novalidate>

                <!-- ------------------- NOMBRE DE USUARIO ------------------- -->
                <div class="campo">
                    <label class="campo__etiqueta" for="loginEmail">Nombre de usuario</label>
                    <input
                        class="campo__input"
                        type="text"
                        id="loginEmail"
                        name="username"
                        autocomplete="off"
                        placeholder="Tu nombre de usuario"
                        required
                    >
                </div>

                <!-- ------------------- CONTRASEÑA ------------------- -->
                <div class="campo">
                    <div class="campo__etiqueta-fila">
                        <label class="campo__etiqueta" for="loginPassword">Contraseña</label>
                    </div>
                    <div class="campo__input-contenedor">
                        <input
                            class="campo__input"
                            type="password"
                            id="loginPassword"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Tu contraseña"
                            required
                        >
                        <button type="button" class="campo__boton-ojo" id="botonOjo" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-icono ojo-icono--cerrado" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                            <svg class="ojo-icono ojo-icono--abierto oculto" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- ------------------- RECORDAR ------------------- -->
                <label class="recordar__label">
                    <input type="checkbox" class="recordar__checkbox" id="loginRecordar" name="recordar">
                    <span class="recordar__texto">Recuérdame en este dispositivo</span>
                </label>

                <!-- ------------------- ERROR GLOBAL ------------------- -->
                <div class="login-error-global oculto" id="errorGlobal" role="alert">
                    <span id="errorGlobalTexto"></span>
                </div>

                <!-- ------------------- SUBMIT ------------------- -->
                <button type="submit" class="boton-login" id="botonLogin">
                    Iniciar sesión
                </button>

            </form>

            <!-- ------------------- PIE ------------------- -->
            <footer class="login-caja__pie">
                <p class="login-caja__pie-texto">
                    ¿Primera vez aquí?
                    <a href="/front-end/paginas/registro/registro.html" class="login-caja__enlace">Crea una cuenta gratis</a>
                </p>
                <a href="/front-end/paginas/novedades/novedades.html" class="login-caja__continuar">
                    Seguir navegando sin cuenta →
                </a>
            </footer>

        </section>

    </main>

    <script src="./login.js"></script>
</body>
</html>
