<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | anime'n'chill</title>

    <!-- ------------------- FUENTE ------------------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ------------------- ESTILOS ------------------- -->
    <link rel="stylesheet" href="../../componentes/temas.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <!-- ------------------- FONDO ------------------- -->
    <div class="login-fondo" aria-hidden="true">
        <img
            class="login-fondo__imagen"
            src="https://picsum.photos/seed/animenchill-login/1920/1080"
            alt=""
        >
        <div class="login-fondo__overlay"></div>
    </div>

    <!-- ------------------- PÁGINA ------------------- -->
    <main class="login-pagina">

        <!-- Logo encima del formulario -->
        <a href="/front-end/paginas/novedades/novedades.html" class="login-logo" aria-label="Ir a la página principal">
            anime<span class="login-logo__acento">'n'</span>chill
        </a>

        <!-- Caja del formulario -->
        <div class="login-caja">

            <!-- ------------------- CABECERA ------------------- -->
            <header class="login-caja__cabecera">
                <h1 class="login-caja__titulo">Bienvenido de nuevo</h1>
            </header>

            <!-- ------------------- BOTÓN GOOGLE ------------------- -->
            <button type="button" class="boton-google" id="botonGoogle">
                <svg class="boton-google__icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Continuar con Google
            </button>

            <!-- ------------------- SEPARADOR ------------------- -->
            <div class="login-separador">
                <span class="login-separador__linea"></span>
                <span class="login-separador__texto">o con tu correo</span>
                <span class="login-separador__linea"></span>
            </div>

            <!-- ------------------- FORMULARIO ------------------- -->
            <form class="login-formulario" id="formularioLogin" novalidate>

                <!-- Email -->
                <div class="campo">
                    <label class="campo__etiqueta" for="loginEmail">Correo electrónico</label>
                    <input
                        class="campo__input"
                        type="email"
                        id="loginEmail"
                        name="email"
                        autocomplete="email"
                        placeholder="tucorreo@ejemplo.com"
                        required
                    >
                </div>

                <!-- Contraseña -->
                <div class="campo">
                    <div class="campo__etiqueta-fila">
                        <label class="campo__etiqueta" for="loginPassword">Contraseña</label>
                        <a href="/front-end/paginas/recuperar-contrasena/recuperar-contrasena.html" class="campo__enlace-olvidada">
                            ¿La olvidaste?
                        </a>
                    </div>
                    <div class="campo__input-contenedor">
                        <input
                            class="campo__input"
                            type="password"
                            id="loginPassword"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Tu contraseña"
                            required
                        >
                        <button type="button" class="campo__boton-ojo" id="botonOjo" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-icono ojo-icono--cerrado" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                            <svg class="ojo-icono ojo-icono--abierto oculto" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Recuérdame -->
                <label class="recordar__label">
                    <input type="checkbox" class="recordar__checkbox" id="loginRecordar" name="recordar">
                    <span class="recordar__texto">Recuérdame en este dispositivo</span>
                </label>

                <!-- Error global — solo este, los inline los añadiremos al final -->
                <div class="login-error-global oculto" id="errorGlobal" role="alert">
                    <span id="errorGlobalTexto"></span>
                </div>

                <!-- Submit -->
                <button type="submit" class="boton-login" id="botonLogin">
                    Iniciar sesión
                </button>

            </form>

            <!-- ------------------- PIE ------------------- -->
            <footer class="login-caja__pie">
                <p class="login-caja__pie-texto">
                    ¿Primera vez aquí?
                    <a href="#" class="login-caja__enlace">Crea una cuenta gratis</a>
                </p>
                <a href="/front-end/paginas/novedades/novedades.html" class="login-caja__continuar">
                    Seguir navegando sin cuenta →
                </a>
            </footer>

        </div>

    </main>

    <script src="./login.js"></script>
</body>
</html>
