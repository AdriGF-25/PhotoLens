<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades | anime'n'chill</title>

    <link rel="stylesheet" href="novedades.css">
    <!-- ------------------- FAVICON ------------------- -->
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/favicon.ico">
</head>
<body>

    <!-- ------------------- CABEZERA/NAV ---------------- -->
    <div id="contenedor-header"></div>

    <main class="contenido-principal">

        <!-- ------------------- HERO ------------------- -->
        <section class="hero" aria-label="Noticia destacada">
            <article class="hero__tarjeta">
                <img
                    class="hero__imagen"
                    src="https://picsum.photos/seed/anime-hero/1200/500"
                    alt="Noticia destacada"
                >
                <!-- Etiqueta superpuesta sobre la imagen del hero -->
                <div class="hero__etiqueta-contenedor">
                    <span class="etiqueta etiqueta--manga">Manga</span>
                    <!-- STUB: contador de comentarios — se activará cuando se implemente el feature de comentarios -->
                    <span class="hero__comentarios oculto" aria-label="Número de comentarios">
                        <span class="hero__comentarios-icono">💬</span>
                        <span class="hero__comentarios-numero">0</span>
                    </span>
                </div>

                <div class="hero__contenido">
                    <h1 class="hero__titulo">Chainsaw Man: Fujimoto confirma el inicio de un nuevo arco argumental</h1>
                    <p class="hero__descripcion">
                        El autor de Chainsaw Man ha compartido una nueva imagen promocional
                        que apunta a cambios importantes en la historia.
                    </p>
                    <div class="hero__meta">
                        <span>17 abr 2026</span>
                        <span>·</span>
                        <span>3 min de lectura</span>
                    </div>
                    <a href="#" class="boton-primario">Leer noticia</a>
                </div>
            </article>
        </section>

        <!-- ------------------- FILTROS ------------------- -->
        <section class="zona-filtros" aria-label="Filtros de novedades">
            <div class="zona-filtros__interior">
                <div class="filtros">
                    <button class="filtro filtro--activo" data-filtro="todo">Todo</button>
                    <button class="filtro" data-filtro="manga">Manga</button>
                    <button class="filtro" data-filtro="anime">Anime</button>
                    <button class="filtro" data-filtro="noticia">Noticias</button>
                    <button class="filtro" data-filtro="lanzamiento">Lanzamientos</button>
                </div>
                <p class="conteo-resultados">Mostrando <strong>0</strong> novedades</p>
            </div>
        </section>

        <!-- ------------------- LISTADO DE NOTICIAS ------------------- -->
        <section class="seccion-noticias" aria-label="Listado de novedades">
            <div class="cuadricula-noticias"></div>

            <!-- ------------------- PAGINACION ------------------- -->
            <nav class="paginacion" aria-label="Paginación de noticias">
                <button class="paginacion__btn paginacion__btn--anterior" aria-label="Página anterior" disabled>
                    &#8249;
                </button>
                <div class="paginacion__numeros"></div>
                <button class="paginacion__btn paginacion__btn--siguiente" aria-label="Página siguiente">
                    &#8250;
                </button>
            </nav>
        </section>

    </main>

    <!-- ------------------- FOOTER ---------------- -->
    <div id="contenedor-footer"></div>

    <script src="../../componentes/componentes.js"></script>
    <script src="./novedades.js"></script>
</body>
</html>
